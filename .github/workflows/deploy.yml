name: Mojosim Backend Production Deployment

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  package:
    name: Package - Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decode Environment Variables
        run: |
          if [ -z "${{ secrets.PROD_BACKEND_ENV_FILE }}" ]; then
            echo "Error: PROD_BACKEND_ENV_FILE secret is not set under Settings -> Secrets and variables -> Secrets!"
            exit 1
          fi
          echo "Decrypting environment variables from base64 and saving to .env"
          echo "${{ secrets.PROD_BACKEND_ENV_FILE }}" | base64 -d > .env

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: token
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          echo "Building and pushing Docker image..."
          docker build -t registry.digitalocean.com/mojosim-registry/mojosim-backend:production .
          docker push registry.digitalocean.com/mojosim-registry/mojosim-backend:production

      # Install and authenticate the DigitalOcean CLI tool
      - name: Install DigitalOcean doctl CLI
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Trigger DigitalOcean Garbage Collection to clean up untagged images immediately
      - name: Clean up old untagged images
        run: |
          echo "Starting DigitalOcean Container Registry Garbage Collection..."
          doctl registry garbage-collection start --force

  deploy:
    name: Deploy - Remote Docker Compose Execution
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote Docker Host
        run: |
          # 1. Start SSH agent and add the deployment key
          eval $(ssh-agent -s)
          echo "${{ secrets.RUNNER_SERVER_PRIV_KEY }}" | tr -d '\r' | ssh-add -
          
          # 2. Configure SSH directories and known hosts
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan "${{ secrets.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # 3. Connect to the remote server Docker daemon via SSH
          export DOCKER_HOST="ssh://${{ secrets.PRODUCTION_SERVER_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}"
          
          # Ensure that the shared Docker network exists on the remote host server
          docker network create mojosim-network || true
          
          # 4. Log in to registry on the remote host via the DOCKER_HOST connection
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u token --password-stdin
          
          # 5. Decode environment variables to local .env on the runner
          echo "${{ secrets.PROD_BACKEND_ENV_FILE }}" | base64 -d > .env
          cat .env
          
          # 6. Execute Makefile target if defined in the project
          make production || echo "No makefile target for production found, skipping..."
          
          # 7. Pull new images to the remote server and recreate containers
          docker compose -f production.yml pull
          
          # 8. Run migrations/seeding before starting main container
          echo "Running database configuration (migrations & seeds)..."
          docker compose -f production.yml run --rm db-configurator
          
          # 9. Start application services
          docker compose -f production.yml up -d MojoSim-Backend --force-recreate
          
          # 10. Clean up dangling images on the remote server
          docker image prune -f
name: mojosim-backend
services:
  MojoSim-Backend:
    container_name: MojoSim-Backend-production
    depends_on:
      db-configurator:
        condition: service_completed_successfully
    ports:
      - "3002:3002"
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "1073741824"
        reservations:
          cpus: 0.25
          memory: "268435456"
    environment:
      REDIS_URL: redis://mojosim-backend-redis:6379
    env_file:
      - .env
    image: registry.digitalocean.com/mojosim-registry/mojosim-backend:production
    networks:
      MojoSim-Backend-network: null
    restart: on-failure
  db-configurator:
    command:
      - sh
      - -c
      - |
          echo 'Running database migrations...' &&
          npm run migrate --if-present &&
          echo 'Running database seeding...' &&
          npm run seed --if-present &&
          echo 'Database configuration completed successfully!'
    container_name: MojoSim-Backend-db-configurator
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: "268435456"
      restart_policy:
        condition: on-failure
        max_attempts: 3
    env_file:
      - .env
    image: registry.digitalocean.com/mojosim-registry/mojosim-backend:production
    networks:
      MojoSim-Backend-network: null

networks:
  MojoSim-Backend-network:
    name: mojosim-network
    external: true

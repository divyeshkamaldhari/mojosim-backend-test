  db-configurator:
    image: registry.webcase.me/node-projects/mojosim/mojosim-backend:Production
    container_name: MojoSim-Backend-db-configurator
    env_file:
      - .env
    networks:
      - MojoSim-Backend-network
    # depends_on:
    #   MojoSim-Backend-database:
    #     condition: service_healthy
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        npm run migrate --if-present &&
        echo 'Running database seeding...' &&
        npm run seed --if-present &&
        echo 'Database configuration completed successfully!'
      "
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3


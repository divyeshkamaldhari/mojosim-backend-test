  redis:
   image: redis:7
   container_name: mojosim-backend-redis
   networks:
     - MojoSim-Backend-network
   volumes:
     - MojoSim-Backend_redis_data:/data
   healthcheck:
     test: ["CMD", "redis-cli", "ping"]
     interval: 30s
     timeout: 10s
     retries: 5
     start_period: 30s
   deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M 

volumes:
  # MojoSim-Backend_db_data:
  #   driver: local
  MojoSim-Backend_redis_data:
    driver: local

networks:
  MojoSim-Backend-network:
  traefik-reverse-proxy:
    external: true
